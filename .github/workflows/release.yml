name: Release

# Tag a commit vX.Y.Z (e.g. `git tag v0.2.0 && git push origin v0.2.0`) and this workflow
# builds, tests, packs the NuGet packages, a DLL zip and the per-platform standalone sample
# executables, and attaches them all to a GitHub Release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the release and upload assets
  packages: write # publish the NuGet packages to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build --configuration Release

      # Retry once so a transient timing flake on the runner doesn't fail a release; a real failure
      # still fails twice. See ci.yml for the rationale.
      - name: Test
        run: dotnet test --configuration Release --no-build -- --report-trx || dotnet test --configuration Release --no-build -- --report-trx

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: '**/TestResults/*.trx'

      - name: Pack NuGet packages
        run: |
          dotnet pack src/CoLibra/CoLibra.csproj --configuration Release -p:Version=${{ env.VERSION }} -p:ContinuousIntegrationBuild=true --output artifacts
          dotnet pack src/CoLibra.Messaging.LiteNetLib/CoLibra.Messaging.LiteNetLib.csproj --configuration Release -p:Version=${{ env.VERSION }} -p:ContinuousIntegrationBuild=true --output artifacts

      - name: Publish DLL bundle
        run: |
          dotnet publish src/CoLibra/CoLibra.csproj --configuration Release -p:Version=${{ env.VERSION }} --output publish
          dotnet publish src/CoLibra.Messaging.LiteNetLib/CoLibra.Messaging.LiteNetLib.csproj --configuration Release -p:Version=${{ env.VERSION }} --output publish-udp
          # Single-file UDP extension: LiteNetLib merged in (internalized). MIT obliges us to
          # ship its copyright + permission notice alongside — THIRD-PARTY-NOTICES.txt.
          dotnet tool install --global dotnet-ilrepack
          ilrepack /internalize /lib:publish-udp /out:publish/CoLibra.Messaging.LiteNetLib.dll publish-udp/CoLibra.Messaging.LiteNetLib.dll publish-udp/LiteNetLib.dll
          cp publish-udp/CoLibra.Messaging.LiteNetLib.xml publish/ || true
          cp LICENSE README.md THIRD-PARTY-NOTICES.txt publish/
          mkdir -p artifacts
          (cd publish && zip "../artifacts/CoLibra-${{ env.VERSION }}-net10.0.zip" CoLibra.dll CoLibra.pdb CoLibra.xml CoLibra.Messaging.LiteNetLib.dll CoLibra.Messaging.LiteNetLib.xml LICENSE README.md THIRD-PARTY-NOTICES.txt)

      - name: Publish samples bundles (standalone trimmed executables)
        run: |
          # One standalone .exe per demo per platform: self-contained, trimmed and single-file, so a
          # machine with no .NET installed can run them. Those switches live in samples/Directory.Build.props
          # (a local `dotnet publish -r <rid>` therefore produces exactly what ships here).
          for rid in win-x64 linux-x64; do
            for sample in Worker PrimeGrid Router Chat GameServer Maze HostedMaze; do
              dotnet publish "samples/CoLibra.Sample.$sample/CoLibra.Sample.$sample.csproj" --configuration Release -p:Version=${{ env.VERSION }} --runtime "$rid" -p:DebugType=none --output "samples-publish/$rid"
            done
            rm -f "samples-publish/$rid"/*.xml
            cp samples/SAMPLES-README.txt LICENSE THIRD-PARTY-NOTICES.txt "samples-publish/$rid/"
            (cd "samples-publish/$rid" && zip -r "$GITHUB_WORKSPACE/artifacts/CoLibra-Samples-${{ env.VERSION }}-$rid.zip" .)
          done

      - name: Smoke-test a published executable
        run: |
          # Trimming fails at runtime, not at build time: run one of the shipped binaries and insist
          # it actually routed and deserialized payloads, so a trimmed-away type can't reach a release.
          timeout 25s ./samples-publish/linux-x64/CoLibra.Sample.Router > router.log 2>&1 || true
          cat router.log
          grep -Eq 'processed [1-9]' router.log

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          artifacts/CoLibra.${{ env.VERSION }}.nupkg
          artifacts/CoLibra.Messaging.LiteNetLib.${{ env.VERSION }}.nupkg
          "artifacts/CoLibra-${{ env.VERSION }}-net10.0.zip"
          "artifacts/CoLibra-Samples-${{ env.VERSION }}-win-x64.zip"
          "artifacts/CoLibra-Samples-${{ env.VERSION }}-linux-x64.zip"
          --title "CoLibra ${{ env.VERSION }}"
          --generate-notes

      - name: Publish to GitHub Packages
        # Uses the built-in token — no external secret. --skip-duplicate makes re-runs idempotent.
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ github.token }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate

      # To ALSO publish to nuget.org: add a NUGET_API_KEY repository secret and uncomment.
      # - name: Push to NuGet.org
      #   run: dotnet nuget push artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
