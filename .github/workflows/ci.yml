name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build --configuration Release
      # The real-time multi-node cluster tests occasionally flake on GitHub's 2-core runners under
      # load (documented). Retry once: a transient timing flake clears on a fresh run; a real failure
      # still fails twice. `||` works in both bash (Linux) and PowerShell 7 (Windows).
      - name: Test
        run: dotnet test --configuration Release --no-build -- --report-trx || dotnet test --configuration Release --no-build -- --report-trx
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  # Releases ship the samples as standalone trimmed executables, and trimming breaks at runtime
  # rather than at build time — so build them on every change and run one for real.
  publish-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish standalone trimmed executables
        # Warnings are errors, so a new reflection dependency the trimmer can't follow fails here.
        run: |
          for rid in win-x64 linux-x64; do
            for sample in Worker PrimeGrid Router Chat GameServer Maze HostedMaze; do
              dotnet publish "samples/CoLibra.Sample.$sample/CoLibra.Sample.$sample.csproj" --configuration Release --runtime "$rid" -p:DebugType=none --output "samples-publish/$rid"
            done
          done
      - name: Smoke-test a published executable
        # A single Router node routes to itself, so this round-trips real payloads through the
        # trimmed binary: no handler deliveries means a type the trimmer removed.
        run: |
          timeout 25s ./samples-publish/linux-x64/CoLibra.Sample.Router > router.log 2>&1 || true
          cat router.log
          grep -Eq 'processed [1-9]' router.log
